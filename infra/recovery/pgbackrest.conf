[global]
repo1-type=sftp
repo1-sftp-host=repository
repo1-sftp-host-user=backup
repo1-sftp-private-key-file=/etc/pgbackrest/client
repo1-sftp-known-host=/etc/pgbackrest/known_hosts
repo1-sftp-host-key-check-type=strict
repo1-sftp-host-key-hash-type=sha256
repo1-path=/repository
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
repo1-bundle=y
compress-type=zst
start-fast=y
log-level-file=off
process-max=2

[storeluma]
pg1-path=/var/lib/postgresql/data
