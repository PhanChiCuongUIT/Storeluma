x-identity: &identity
  STORELUMA_SCHEMA_MODE: verify
  BROKER_TOPOLOGY_MODE: managed
  OIDC_ISSUER: https://${IDENTITY_HOST:?}/realms/storeluma
  OIDC_INTERNAL: https://${IDENTITY_HOST:?}/realms/storeluma
x-service: &service
  networks: [default, edge]
  environment: *identity
services:
  edge:
    image: ${EDGE_IMAGE:?}
    environment: {APP_HOST: '${APP_HOST:?}', IDENTITY_HOST: '${IDENTITY_HOST:?}'}
    ports: ['80:80', '443:443']
    volumes: ['./infra/pilot/Caddyfile:/etc/caddy/Caddyfile:ro', 'certificates:/data', 'caddy_config:/config']
    networks:
      edge:
        aliases: ['${IDENTITY_HOST:?}']
    restart: unless-stopped
  postgres:
    image: ${POSTGRES_IMAGE:?}
    restart: unless-stopped
    ports: !reset []
    networks: [default, backup]
    volumes:
      - ${PILOT_CONFIG_DIR:?}/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ${PILOT_CONFIG_DIR:?}/pgbackrest:/etc/pgbackrest:ro
    command: [postgres, -c, archive_mode=on, -c, archive_timeout=60s, -c, "archive_command=pgbackrest --stanza=storeluma archive-push %p"]
  rabbitmq:
    image: ${RABBITMQ_IMAGE:?}
    restart: unless-stopped
    ports: !reset []
  keycloak:
    image: ${KEYCLOAK_IMAGE:?}
    restart: unless-stopped
    ports: !reset []
    networks: [default, edge]
    command: [start, --import-realm]
    environment:
      KC_HOSTNAME: https://${IDENTITY_HOST:?}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ${PILOT_CONFIG_DIR:?}/realm.json:/opt/keycloak/data/import/storeluma-realm.json:ro
  gateway:
    <<: *service
    build: !reset null
    image: ${GATEWAY_IMAGE:?}
    ports: !reset []
    environment:
      <<: *identity
      WEB_ORIGIN: https://${APP_HOST:?}
      DATABASE_URL: ${GATEWAY_RUNTIME_URL:?}
      RABBIT_URL: ''
  business:
    <<: *service
    build: !reset null
    image: ${BUSINESS_IMAGE:?}
    environment:
      <<: *identity
      DATABASE_URL: ${BUSINESS_RUNTIME_URL:?}
      RABBIT_URL: ${BUSINESS_BROKER_URL:?}
  catalog:
    <<: *service
    build: !reset null
    image: ${CATALOG_IMAGE:?}
    environment:
      <<: *identity
      DATABASE_URL: ${CATALOG_RUNTIME_URL:?}
      RABBIT_URL: ${CATALOG_BROKER_URL:?}
  inventory:
    <<: *service
    build: !reset null
    image: ${INVENTORY_IMAGE:?}
    environment:
      <<: *identity
      DATABASE_URL: ${INVENTORY_RUNTIME_URL:?}
      RABBIT_URL: ${INVENTORY_BROKER_URL:?}
  sales:
    <<: *service
    build: !reset null
    image: ${SALES_IMAGE:?}
    environment:
      <<: *identity
      DATABASE_URL: ${SALES_RUNTIME_URL:?}
      RABBIT_URL: ${SALES_BROKER_URL:?}
  finance:
    <<: *service
    build: !reset null
    image: ${FINANCE_IMAGE:?}
    environment:
      <<: *identity
      DATABASE_URL: ${FINANCE_RUNTIME_URL:?}
      RABBIT_URL: ${FINANCE_BROKER_URL:?}
  reporting:
    <<: *service
    build: !reset null
    image: ${REPORTING_IMAGE:?}
    environment:
      <<: *identity
      DATABASE_URL: ${REPORTING_RUNTIME_URL:?}
      RABBIT_URL: ${REPORTING_BROKER_URL:?}
  notification:
    <<: *service
    build: !reset null
    image: ${NOTIFICATION_IMAGE:?}
    environment:
      <<: *identity
      DATABASE_URL: ${NOTIFICATION_RUNTIME_URL:?}
      RABBIT_URL: ${NOTIFICATION_BROKER_URL:?}
networks:
  default: {internal: true}
  edge: {}
  backup: {}
volumes:
  certificates: {}
  caddy_config: {}
