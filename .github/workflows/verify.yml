name: Verify Storeluma
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build --wait
      - name: Run integration and migration tests
        run: npm test
      - name: Capture service status
        if: always()
        run: |
          mkdir -p tmp/ci-status
          docker compose ps --all --format json > tmp/ci-status/services.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integration-verification
          retention-days: 7
          path: |
            docs/week-04/evidence/
            docs/week-05/evidence/
            docs/week-06/evidence/
            tmp/week06/screenshots/
            tmp/playwright-results.json
            playwright-report/
            test-results/
            tmp/ci-status/
      - run: docker compose down
        if: always()
